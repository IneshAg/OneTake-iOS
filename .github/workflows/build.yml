name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project OneTake.xcodeproj \
            -scheme OneTake \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
      # The camera, preview and photo code only exists in device builds (the Simulator has no
      # camera, so it's behind #if targetEnvironment(simulator)); build for a device too so that
      # code is compiled on every push.
      - name: Build for iOS device
        run: |
          xcodebuild build \
            -project OneTake.xcodeproj \
            -scheme OneTake \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
