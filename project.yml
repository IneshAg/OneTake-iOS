name: OneTake
options:
  bundleIdPrefix: com.onetake
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  OneTake:
    type: application
    platform: iOS
    sources:
      - path: OneTake
      - path: Shared
    # iCloud Drive (CloudDocuments) for "Email or link": the exported tape is uploaded to the app's
    # own iCloud container and published as a download link. Needs a development team with this
    # container registered in the Apple Developer portal.
    entitlements:
      path: OneTake/OneTake.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.onetake.app
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.onetake.app
        # Shared with the widget extension, which reads the snapshot the app writes.
        com.apple.security.application-groups:
          - group.com.onetake.app
        # Sign in with Apple (sign-in is only asked for when sending a tape as a link).
        com.apple.developer.applesignin:
          - Default
    # Merged with the generated Info.plist (GENERATE_INFOPLIST_FILE): Google's client ID and the
    # URL schemes for Google's sign-in redirect and the widgets' onetake:// links.
    info:
      path: OneTake/Info.plist
      properties:
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [onetake]
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
    dependencies:
      - target: OneTakeWidgets
      - target: OneTakeShare
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onetake.app
        # From Google Cloud Console → Credentials → OAuth client ID (iOS). Until these are real,
        # the Google button stays disabled rather than crashing.
        GOOGLE_CLIENT_ID: YOUR_CLIENT_ID.apps.googleusercontent.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.YOUR_CLIENT_ID
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: OneTake
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "OneTake films your self-tapes and headshots. Takes stay on this iPhone until you send them."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "OneTake records your voice for takes and reader tracks."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "OneTake listens so the prompter can follow your lines and hear “Action” and “Cut”."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Save finished tapes to Photos."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Home Screen / Lock Screen widgets and the Live Activity (Dynamic Island).
  OneTakeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: OneTakeWidgets
      - path: Shared
      - path: OneTake/DesignSystem/Theme.swift
    info:
      path: OneTakeWidgets/Info.plist
      properties:
        CFBundleDisplayName: OneTake
        # Extensions must carry the app's own version, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: OneTakeWidgets/OneTakeWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.onetake.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onetake.app.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # "Share to OneTake" from Mail, WhatsApp, Safari, Photos and Files. Drops what's shared into the
  # App Group inbox (Shared/ShareInbox.swift); the app opens Add audition with it.
  OneTakeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OneTakeShare
      - path: Shared/ShareInbox.swift
      - path: Shared/WidgetSnapshot.swift
    info:
      path: OneTakeShare/Info.plist
      properties:
        CFBundleDisplayName: OneTake
        # Extensions must carry the app's own version, or App Store Connect rejects the upload.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 5
    entitlements:
      path: OneTakeShare/OneTakeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.onetake.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onetake.app.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  OneTakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OneTakeTests
    dependencies:
      - target: OneTake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onetake.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OneTake:
    build:
      targets:
        OneTake: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OneTakeTests
